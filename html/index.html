<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css"> <script src="script.js" defer></script> </head>
<body>
    <header>
        <h1>📖 My Digital Library</h1>
    </header>

    <main>
        <button id="newBookBtn">➕ New Book</button>

        <dialog id="bookFormModal">
            <form id="bookForm" method="dialog">
                <h2>Add New Book</h2>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>

                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" required min="1">

                <div class="checkbox-group">
                    <label for="read">Have you read it?</label>
                    <input type="checkbox" id="read" name="read">
                </div>

                <div class="form-actions">
                    <button type="submit">Add Book</button>
                    <button type="button" id="closeFormBtn">Cancel</button>
                </div>
            </form>
        </dialog>

        <div id="libraryContainer" class="book-grid">
            </div>
    </main>
</body>
</html>
